[project]
name = "rag-embed"
version = "0.1.0"
description = "Pipeline module for the agentic RAG pipeline (stage 5: embed — staged nodes → TEI → Qdrant, ledger bookkeeping)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_embed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
