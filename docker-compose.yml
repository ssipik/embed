# One-off runs: docker compose run --rm pipeline python -m rag_embed --batch-id <id>
# Needs ../postgres, ../qdrant and ../tei up (all publish on the host).
services:
  pipeline:
    build:
      context: .
      secrets:
        - git_token
    command: python -m rag_embed --batch-id 21
    # command: tail -f /dev/null
    volumes:
      # live-mount code over the image copy (edit without rebuild); sources.yaml
      # and parameters.yaml come from the rag-config dependency, not from here
      - ./src:/app
      - ./.vscode:/app/.vscode
    environment:
      # host.docker.internal = the host machine, where the services publish
      RAG_PG_DSN: postgresql+psycopg://rag:rag@host.docker.internal:5433/rag_ingestion
      RAG_TEI_URL: http://host.docker.internal:8080
      RAG_QDRANT_URL: http://host.docker.internal:6333
      # CPU inference is ~3-5 s per ~1000-token chunk and scales linearly, so a
      # request costs batch_size x that. 8 matches the max_batch_requests TEI
      # forces for bge-m3 (bigger requests buy no throughput, only longer ones),
      # and the timeout covers a worst-case full batch plus queueing.
      RAG_EMBED_BATCH_SIZE: "8"
      RAG_HTTP_TIMEOUT: "180"

# Build-time only: the private rag-config repo is cloned by `uv sync` in the
# Dockerfile. BuildKit mounts this for that one RUN, so no layer holds it.
secrets:
  git_token:
    environment: RAG_BITBUCKET_API_TOKEN
